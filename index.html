<script>
(function () {
  var zones = document.querySelectorAll('.zone[data-word]');
  function setLit(word, on) {
    zones.forEach(function (z) {
      if (z.dataset.word === word) z.classList.toggle('lit', on);
    });
  }
  zones.forEach(function (z) {
    z.addEventListener('mouseenter', function () { setLit(z.dataset.word, true); });
    z.addEventListener('mouseleave', function () { setLit(z.dataset.word, false); });
    z.addEventListener('focus', function () { setLit(z.dataset.word, true); });
    z.addEventListener('blur', function () { setLit(z.dataset.word, false); });
  });
})();
</script>
